server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
    gzip_static on;

    location = /health {
        access_log off;
        default_type text/plain;
        add_header X-Robots-Tag "noindex" always;
        return 200 "ok\n";
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    # Long cache only for content-addressed assets. New bytes produce a new URL.
    location ~* "^/assets/.*\.[a-f0-9]{12}\.(css|js|webp|jpg)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
    # This landing page uses anchors, not application routes: missing pages are 404.
    location / { try_files $uri $uri/ =404; }
}
